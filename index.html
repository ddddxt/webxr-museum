<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>XR虚拟展厅</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 加载状态面板（Quest 3 里能直接看到） -->
    <div id="loading-panel" style="
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #000;
        color: #0f0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: monospace;
        font-size: 24px;
        z-index: 99999;
    ">
        <div id="loading-text">⏳ 正在初始化...</div>
        <div id="loading-detail" style="font-size: 16px; color: #888; margin-top: 10px;"></div>
    </div>
    
    <div id="info">
        XR虚拟展厅
        <span id="vr-status"></span>
    </div>
    <button id="vr-btn">进入 VR 模式</button>
    <div id="instructions">
        💡点击画面后锁定鼠标，即可用 WASD 移动<br>
        VR模式：戴上头显后自动追踪头部，键盘仍可移动
    </div>

    
    <video id="museum-video" 
           crossOrigin="anonymous" 
           playsinline 
           muted 
           loop 
           style="display:none;">
        <source src="video/vi.mp4" type="video/mp4">
        你的浏览器不支持 MP4 视频。
    </video>

        <div id="canvas-container"></div>

    <!-- 引入 Three.js 及相关扩展 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
